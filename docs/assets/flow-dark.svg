<path d="M0.5 299.0H839.5" stroke="#3d444d"/>
<path d="M0.5 417.0H839.5" stroke="#3d444d"/>
<circle cx="35" cy="68" r="11" fill="none" stroke="#3d444d" stroke-width="1.4"/><text x="35" y="72.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#9198a1">1</text>
<text x="60" y="73" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="650" fill="#f0f6fc">Plan</text>
<text x="136" y="73.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">Paths and size set the risk. Low risk is two</text>
<text x="136" y="93.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">seats, medium three, high four. The lab that</text>
<text x="136" y="114.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">wrote the work sits out.</text>
<circle cx="536.2" cy="68.5" r="1.8" fill="#9198a1"/>
<text x="550" y="73" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#9198a1">risk: high, so 4 seats</text>
<circle cx="536.2" cy="90.5" r="1.8" fill="#9198a1"/>
<text x="550" y="95" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#9198a1">opus: author, not seated</text>
<circle cx="35" cy="159.5" r="11" fill="none" stroke="#3d444d" stroke-width="1.4"/><text x="35" y="164.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#9198a1">2</text>
<text x="60" y="164.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="650" fill="#f0f6fc">Check</text>
<text x="136" y="164.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">Each candidate is asked for one word before</text>
<text x="136" y="185.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">any code is sent. A dead one loses its seat.</text>
<circle cx="536.2" cy="160.0" r="5.4" fill="none" stroke="#f0883e" stroke-width="1.6"/><path d="M536.2 157.0v3.4M536.2 162.6v.1" stroke="#f0883e" stroke-width="1.7" stroke-linecap="round"/>
<text x="550" y="164.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#f0f6fc">gemma: model-not-found (HTTP 404)</text>
<circle cx="536.2" cy="182.0" r="5.4" fill="none" stroke="#f0883e" stroke-width="1.6"/><path d="M536.2 179.0v3.4M536.2 184.6v.1" stroke="#f0883e" stroke-width="1.7" stroke-linecap="round"/>
<text x="550" y="186.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#f0f6fc">delta: out-of-credit (HTTP 402)</text>
<circle cx="35" cy="233.5" r="11" fill="none" stroke="#3d444d" stroke-width="1.4"/><text x="35" y="238.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#9198a1">3</text>
<text x="60" y="238.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="650" fill="#f0f6fc">Ask</text>
<text x="136" y="238.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">The same packet goes to every seat at once,</text>
<text x="136" y="259.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">with a timeout. The worst case of each call</text>
<text x="136" y="279.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">is set aside under the spend cap first.</text>
<circle cx="536.2" cy="234.0" r="1.8" fill="#9198a1"/>
<text x="550" y="238.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#9198a1">asking 4 of 4</text>
<circle cx="536.2" cy="256.0" r="5.4" fill="none" stroke="#f0883e" stroke-width="1.6"/><path d="M536.2 253.0v3.4M536.2 258.6v.1" stroke="#f0883e" stroke-width="1.7" stroke-linecap="round"/>
<text x="550" y="260.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#f0f6fc">echo: over-budget, not called</text>
<circle cx="35" cy="325.0" r="11" fill="none" stroke="#3d444d" stroke-width="1.4"/><text x="35" y="329.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#9198a1">4</text>
<text x="60" y="330.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="650" fill="#f0f6fc">Judge</text>
<text x="136" y="330.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">A reply counts only if it arrived whole, is</text>
<text x="136" y="350.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">signed for this run, and its findings add up.</text>
<path d="M531 325.9 l3.6 3.6 6.6 -7.4" fill="none" stroke="#3fb950" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="550" y="330.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#f0f6fc">nemotron: 4 findings</text>
<path d="M531 347.9 l3.6 3.6 6.6 -7.4" fill="none" stroke="#3fb950" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="550" y="352.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#f0f6fc">minimax: 5 findings</text>
<path d="M531 369.9 l3.6 3.6 6.6 -7.4" fill="none" stroke="#3fb950" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="550" y="374.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#f0f6fc">mistral: 5 findings</text>
<circle cx="536.2" cy="391.5" r="5.4" fill="none" stroke="#f0883e" stroke-width="1.6"/><path d="M536.2 388.5v3.4M536.2 394.1v.1" stroke="#f0883e" stroke-width="1.7" stroke-linecap="round"/>
<text x="550" y="396.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#f0f6fc">kimi: timeout after 300 s</text>
<circle cx="35" cy="443.0" r="11" fill="none" stroke="#3d444d" stroke-width="1.4"/><text x="35" y="447.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#9198a1">5</text>
<text x="60" y="448.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="650" fill="#f0f6fc">Decide</text>
<text x="136" y="448.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">A person reads the answers. Code never counts</text>
<text x="136" y="468.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f0f6fc">votes, and a missing answer is never a yes.</text>
<circle cx="536.2" cy="443.5" r="1.8" fill="#9198a1"/>
<text x="550" y="448.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#9198a1">3 of 4 answered: not complete</text>
