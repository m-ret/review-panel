<circle cx="30" cy="419.0" r="12" fill="none" stroke="#d1d9e0" stroke-width="1.4"/><text x="30" y="424.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#59636e">3</text>
<text x="54" y="425.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#1f2328">Ask</text>
<text x="18" y="456.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">The same packet goes to every seat at</text>
<text x="18" y="478.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">once, with a timeout. The worst case of</text>
<text x="18" y="501.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">each call is set aside under the spend</text>
<text x="18" y="523.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">cap first.</text>
