<circle cx="24.2" cy="586.0" r="1.8" fill="#59636e"/>
<text x="39" y="590.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#59636e">worst case $0 of $0.50</text>
