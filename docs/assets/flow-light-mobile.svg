<text x="18" y="111.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">lab that wrote the work sits out.</text>
<rect x=".5" y="129.0" width="399" height="66" fill="#f6f8fa"/>
<circle cx="24.2" cy="149.5" r="1.8" fill="#59636e"/>
<text x="39" y="154.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#59636e">risk: high, so 4 seats</text>
<circle cx="24.2" cy="173.5" r="1.8" fill="#59636e"/>
<text x="39" y="178.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#59636e">claude: anthropic sits out</text>
<path d="M.5 195.0H399.5" stroke="#d1d9e0"/>
<circle cx="30" cy="224.0" r="12" fill="none" stroke="#d1d9e0" stroke-width="1.4"/><text x="30" y="229.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#59636e">2</text>
<text x="54" y="230.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#1f2328">Check</text>
<text x="18" y="261.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">Each candidate is asked for one word</text>
<text x="18" y="283.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">before any code is sent. A dead one</text>
<text x="18" y="306.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">loses its seat.</text>
