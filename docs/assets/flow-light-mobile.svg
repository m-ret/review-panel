<circle cx="30" cy="636.5" r="12" fill="none" stroke="#d1d9e0" stroke-width="1.4"/><text x="30" y="641.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#59636e">4</text>
<text x="54" y="642.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#1f2328">Judge</text>
<text x="18" y="673.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">A reply counts only if it arrived whole,</text>
<text x="18" y="696.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">is signed for this run, and its findings</text>
<text x="18" y="718.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">add up.</text>
