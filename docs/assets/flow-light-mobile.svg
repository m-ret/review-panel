<path d="M19 781.4 l3.6 3.6 6.6 -7.4" fill="none" stroke="#1a7f37" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="39" y="785.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#1f2328">mistral: 5 findings</text>
<path d="M19 805.4 l3.6 3.6 6.6 -7.4" fill="none" stroke="#1a7f37" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="39" y="809.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#1f2328">minimax: 5 findings</text>
<circle cx="24.2" cy="829.0" r="5.4" fill="none" stroke="#bc4c00" stroke-width="1.6"/><path d="M24.2 826.0v3.4M24.2 831.6v.1" stroke="#bc4c00" stroke-width="1.7" stroke-linecap="round"/>
<text x="39" y="833.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#1f2328">step: timeout after 300 s</text>
