<text x="39" y="349.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#1f2328">gemma: model-not-found (HTTP 404)</text>
<circle cx="24.2" cy="368.5" r="5.4" fill="none" stroke="#bc4c00" stroke-width="1.6"/><path d="M24.2 365.5v3.4M24.2 371.1v.1" stroke="#bc4c00" stroke-width="1.7" stroke-linecap="round"/>
<text x="39" y="373.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#1f2328">kimi: timeout after 60 s</text>
