<text x="54" y="885.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#1f2328">Decide</text>
<text x="18" y="916.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">A person reads the answers. Code never</text>
<text x="18" y="939.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">counts votes, and a missing answer is</text>
<text x="18" y="961.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1f2328">never a yes.</text>
