<text x="39" y="349.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#f0f6fc">gemma: model-not-found (HTTP 404)</text>
