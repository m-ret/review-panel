<text x="39" y="833.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#f0f6fc">kimi: timeout after 300 s</text>
