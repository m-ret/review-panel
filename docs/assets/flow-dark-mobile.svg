<text x="18" y="261.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#f0f6fc">Each candidate is asked for one word</text>
