<text x="54" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#f0f6fc">Plan</text>
<text x="18" y="66.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#f0f6fc">Paths and size set the risk. Low risk is</text>
